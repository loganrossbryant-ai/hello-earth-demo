<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10295d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>Zig &amp; the Lost Star Map • Offline English Game</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#fff;background:#09142d}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#254a9a,#0b1535 55%,#060c1d)}main{max-width:550px;width:92%;padding:24px;border:1px solid #6aceff99;border-radius:26px;background:#0b1a40cc;text-align:center;box-shadow:0 25px 80px #0008}img{width:128px;height:128px}h1{font-size:clamp(25px,6vw,38px);line-height:1.1;margin:12px 0}p{font-size:15px;line-height:1.5;color:#d8e9ff}#progress{height:16px;border-radius:20px;background:#1b315c;overflow:hidden;border:1px solid #74d5ff;margin:18px 0}#bar{height:100%;width:0%;background:linear-gradient(90deg,#63e0ff,#ffe472);transition:width .18s}#status{font-weight:700;color:#9eebff}#error{display:none;background:#4c2442;border:1px solid #fa8191;border-radius:12px;padding:12px;margin-top:12px;text-align:left}button{font-size:17px;background:#89eefe;color:#082c44;border:0;border-radius:12px;padding:12px 16px;font-weight:800}small{color:#bad6fa}
</style></head><body><main><img src="./icon.svg" alt="Zig robot"><h1>Zig &amp; the Lost Star Map</h1><p>首次需要联网下载游戏。完成后打开主屏幕图标即可离线玩。<br>First visit needs internet. Once installed and cached, Zig works offline.</p><div id="progress"><div id="bar"></div></div><div id="status" role="status" aria-live="polite">Preparing… / 正在准备</div><div id="error"><p id="errorText"></p><button id="retry">重试 / Retry</button></div><p><small>iPhone: Open in Safari → Share → Add to Home Screen.<br>在 Safari 中打开 → 分享 → 添加到主屏幕。</small></p></main>
<script>
(async function(){
const N=24,CHARS=16774605,VERSION='zig-ios-2026-11-08-v1';
const names=Array.from({length:N},(_,i)=>'./parts/part-'+String(i).padStart(3,'0')+'.txt');
const bar=document.getElementById('bar'),status=document.getElementById('status'),errorBox=document.getElementById('error'),errorText=document.getElementById('errorText'),retry=document.getElementById('retry');
retry.onclick=()=>location.reload();
if('serviceWorker' in navigator)try{await navigator.serviceWorker.register('./service-worker.js',{scope:'./'});}catch(e){console.warn('Service worker:',e);}
const cache='caches' in window?await caches.open(VERSION):null;
const parts=new Array(N);let completed=0;
async function loadOne(i){
 const url=names[i]; let last;
 for(let attempt=1;attempt<=3;attempt++)try{
   let res=await fetch(url,{cache:'force-cache'});if(!res.ok)throw Error('HTTP '+res.status+' '+url);
   const s=await res.text();if(s.length<2000)throw Error('Incomplete game part '+(i+1));
   parts[i]=s;
   if(cache)await cache.put(new URL(url,location.href),new Response(s,{headers:{'Content-Type':'text/plain; charset=utf-8'}}));
   completed++;bar.style.width=Math.round(completed*100/N)+'%';status.textContent=`Downloading game ${completed}/${N} · 下载游戏 ${completed}/${N}`;
   return;
 }catch(e){last=e;await new Promise(resolve=>setTimeout(resolve,attempt*550));}
 throw last;
}
try{
 let next=0;await Promise.all(Array.from({length:4},async()=>{while(next<N){let i=next++;await loadOne(i);}}));
 let full=parts.join('');if(full.length!==CHARS)throw Error('Game content size mismatch ('+full.length+' instead of '+CHARS+')');
 status.textContent='✓ Game ready offline / 离线游戏已准备好';bar.style.width='100%';
 // Retain install metadata on the final game document.
 const boot=`<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">`;
 full=full.replace('</head>',boot+'</head>');
 await new Promise(resolve=>setTimeout(resolve,600));
 document.open();document.write(full);document.close();
}catch(e){console.error(e);errorText.textContent='Download incomplete / 下载失败：'+e.message+'。请连接网络后再试。';errorBox.style.display='block';status.textContent='Connection needed / 需要联网';}
})();
</script></body></html>
